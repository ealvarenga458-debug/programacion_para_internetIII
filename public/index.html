<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Tareas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="todoApp" ng-controller="TodoController" class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0">Mis Tareas</h3>
            </div>
            <div class="card-body">
                
                <form ng-submit="agregarTarea()" class="input-group mb-3">
                    <input type="text" ng-model="nuevaTarea" class="form-control" placeholder="Escribe una nueva tarea..." required>
                    <button class="btn btn-success" type="submit">Agregar</button>
                </form>

                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center" ng-repeat="tarea in tareas">
                        {{ tarea.titulo }}
                        <span class="badge bg-secondary rounded-pill">ID: {{ tarea.id }}</span>
                    </li>
                    
                    <li class="list-group-item text-center text-muted" ng-if="tareas.length === 0">
                        No hay tareas guardadas.
                    </li>
                </ul>

            </div>
        </div>
    </div>

    <script>
        // Inicialización del módulo
        var app = angular.module('todoApp', []);

        app.controller('TodoController', function($scope, $http) {
            $scope.tareas = [];
            $scope.nuevaTarea = "";

            // Usamos rutas relativas '/api/tareas' para evitar problemas de puertos
            $scope.obtenerTareas = function() {
                $http.get('/api/tareas')
                    .then(function(response) {
                        $scope.tareas = response.data;
                    }, function(error) {
                        console.error("Error al cargar:", error);
                    });
            };

            $scope.agregarTarea = function() {
                $http.post('/api/tareas', { titulo: $scope.nuevaTarea })
                    .then(function(response) {
                        $scope.nuevaTarea = "";
                        $scope.obtenerTareas(); // Recargamos la lista
                    }, function(error) {
                        console.error("Error al guardar:", error);
                    });
            };

            // Ejecutar al cargar la página
            $scope.obtenerTareas();
        });
    </script>
</body>
</html>
